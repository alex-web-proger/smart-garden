sentence=ESP-NOW protocol and reusable peripheral-node logic for the Smart Garden project.
paragraph=Shared packet protocol (GardenProtocol.h) and a transport-agnostic GardenNode helper class handling addressing, deduplication, jitter, watchdog and CONFIG/TELEMETRY/ACK exchange for ESP8266/ESP32 peripheral nodes. Transport (esp_now_init/send/recv callback registration) stays in the sketch since the API differs between ESP8266 and ESP32.
